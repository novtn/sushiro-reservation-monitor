[project]
name = "sushiro"
version = "0.2.0"
description = "Sushiro mini-program read-only API client"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
capture = ["mitmproxy>=10.0"]

[project.scripts]
sushiro = "sushiro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sushiro"]
